<!-- Blog post images are in 748:333 (2.24) ratio -->
<!DOCTYPE html>
<head>
    <title>Blog?</title>
    <link rel="shortcut icon" href="webicon.gif" type="image/x-icon">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        * {
            margin: 0;
            padding: 0;
        }
    
        body {
            background-image: url(blog_background.gif);
            text-align: center;
            color: white;
            line-height: 1;
            font-size: 24px;
        }

        h1 {
            font-size: 48px;
        }

        post {
            background-image: url(post_background.jpg);
            border-radius: 8px;
            min-width: 100%;
            display: block;
            margin-top: 16px;
            overflow: hidden;
        }

        button {
            margin-bottom: 8px;
            width: 100px;
            height: 24px;

            background-image: url(button.jpg);
            border-color: white;
            color: white;
        }

        button:hover {
            transform: translateY(-4px) scale(1.1);
            filter: drop-shadow(0px 0px 4px black);
        }

        .hidden {
            display: none !important;
        }

        .posts {
            width: 780px;
            min-height: 12px;
            margin-left: calc(50% - 390px);
            text-align: left;
        }

        .post-title {
            padding-left: 8px;
            padding-top: 8px;
            padding-bottom: 8px;
        }

        .post-content {
            width: calc(100% - 24px);
            margin-left: 8px;
            margin-bottom: 8px;
            padding-left: 8px;
            padding-top: 8px;
            padding-bottom: 8px;
            background-color: white;
            color: black;
        }
        
        .post-content > img {
            padding-top: 8px;
            display: block;
            height: 333px;
            width: auto;
        }

        .post-content > img:hover {
            transform: translateY(-4px) scale(1.05);
            filter: drop-shadow(0px 0px 4px black);
            cursor: pointer;
        }

        #img-preview {
            background-color: rgba(0, 0, 0, 0.5);
            position: absolute;
            left: 0;
            top: 0;
            height: 100vh;
            width: 100vw;
            cursor: pointer;
            text-align: center;
            display: block;
            align-content: center;
            z-index: 9999999;
        }

        #img-preview > img {
            max-height: 80%;
            max-width: 80%;
            width: auto;
            height: auto;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div id="img-preview" class="hidden"></div>
    <h1>Lsalwestfox's Blog</h1>
    <p>Is it blog? I don't know. Images are heavily compressed, but by clicking on them you can view uncompressed version, grep for ID:[ID] to get specific post</p>
    <a href="index.html"><button>Back</button></a><br>
    <div class="posts">
        <post time="01:27PM" date="07/08/2026">
            <p>This is first post ever</p>
        </post>
    </div>
    <br>
    <br>
    <br>
    <br>
    <br>
</body>
<script>
    const ImagePreview = document.getElementById('img-preview');
    const Posts = document.querySelectorAll('post');
    let Id = Posts.length;

    Posts.forEach((e) => {
        const time = e.getAttribute('time');
        const date = e.getAttribute('date');
        const content = e.innerHTML;
        e.innerHTML = `<p class="post-title">${date} at ${time}, ID:${--Id}</p><div class="post-content">${content}</div>`;
        e.querySelectorAll('img').forEach((i) => {
            i.addEventListener('click', () => {
                ImagePreview.innerHTML = `<img src="${i.getAttribute('u')}">`;
                ImagePreview.classList.remove('hidden');
            });
        });
    });

    ImagePreview.addEventListener('click', () => {
        ImagePreview.classList.add('hidden');
    });
</script>
